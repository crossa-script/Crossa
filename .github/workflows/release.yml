name: Release Crossa

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: crossa-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Validate branch
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Releases must be created from main."
            exit 1
          fi

      - name: Validate version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION"
            echo "Expected semantic version such as 0.1.0"
            exit 1
          fi

      - name: Ensure tag does not exist
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git fetch --tags --force
          if git rev-parse "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists."
            exit 1
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: validate
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macOS ARM64
            os: macos-15
            artifact: macos-arm64
            extension: tar.gz

          - name: Linux x86_64
            os: ubuntu-24.04
            artifact: linux-x86_64
            extension: tar.gz

          - name: Windows x86_64
            os: windows-2022
            artifact: windows-x86_64
            extension: zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build libcurl4-openssl-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew update
          brew install cmake ninja

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install curl:x64-windows-static

      - name: Configure Release
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake \
            -S . \
            -B build/release \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Configure Release for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake `
            -S . `
            -B build/release `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build Crossa
        if: runner.os != 'Windows'
        shell: bash
        run: cmake --build build/release --config Release --target crossa --parallel

      - name: Build Crossa for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake --build build/release --config Release --target crossa --parallel

      - name: Verify Crossa binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ ! -x "build/release/crossa" ]]; then
            echo "Crossa executable not found at build/release/crossa"
            exit 1
          fi
          ./build/release/crossa --help

      - name: Verify Crossa Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $crossaBinary = "build/release/Release/crossa.exe"
          if (-not (Test-Path $crossaBinary)) {
            Write-Error "Crossa executable not found at $crossaBinary"
            exit 1
          }
          & $crossaBinary --help

      - name: Package Crossa
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          PLATFORM: ${{ matrix.artifact }}
        run: |
          package_name="crossa-v${VERSION}-${PLATFORM}"
          mkdir -p "dist/${package_name}"
          cp build/release/crossa "dist/${package_name}/crossa"
          chmod +x "dist/${package_name}/crossa"
          tar -C dist -czf "${package_name}.tar.gz" "${package_name}"

      - name: Package Crossa for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          PLATFORM: ${{ matrix.artifact }}
        run: |
          $packageName = "crossa-v$env:VERSION-$env:PLATFORM"
          $packageDirectory = Join-Path "dist" $packageName
          New-Item -ItemType Directory -Path $packageDirectory -Force | Out-Null
          Copy-Item "build/release/Release/crossa.exe" (Join-Path $packageDirectory "crossa.exe") -Force
          Compress-Archive -Path $packageDirectory -DestinationPath "$packageName.zip" -Force

      - name: Upload build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crossa-${{ matrix.artifact }}
          path: crossa-v${{ inputs.version }}-${{ matrix.artifact }}.${{ matrix.extension }}
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Download builds
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: release-assets
          merge-multiple: true

      - name: Ensure tag still does not exist
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git fetch --tags --force
          if git rev-parse "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists."
            exit 1
          fi

      - name: Generate checksums
        shell: bash
        working-directory: release-assets
        run: |
          mapfile -t archives < <(
            find . -maxdepth 1 -type f -name 'crossa-*' -printf '%f\n' |
              sort
          )
          if [[ "${#archives[@]}" -eq 0 ]]; then
            echo "No release archives found."
            exit 1
          fi
          sha256sum "${archives[@]}" > SHA256SUMS

      - name: Attest release archives
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: release-assets/crossa-*

      - name: Skip provenance attestation for private repository
        if: github.event.repository.visibility != 'public'
        run: echo "Skipping build provenance attestation because this private repository is not eligible on the current GitHub plan."

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v${VERSION}" \
            release-assets/* \
            --target "${GITHUB_SHA}" \
            --title "Crossa v${VERSION}" \
            --generate-notes \
            --verify-tag=false
